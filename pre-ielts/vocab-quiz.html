<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Pre-IELTS — Vocab quiz</title>
  <style>
    :root {
      --bg: #f6f4ef;
      --card: #fff;
      --ink: #1c1917;
      --muted: #57534e;
      --line: #e7e5e4;
      --ok: #166534;
      --ok-bg: #dcfce7;
      --bad: #991b1b;
      --bad-bg: #fee2e2;
      --accent: #1d4ed8;
      --accent-bg: #eff6ff;
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      font-family: "Segoe UI", system-ui, sans-serif;
      background: var(--bg);
      color: var(--ink);
      line-height: 1.45;
    }
    main {
      max-width: 40rem;
      margin: 0 auto;
      padding: 1.5rem 1rem 3rem;
    }
    h1 { font-size: 1.35rem; font-weight: 650; margin: 0 0 0.25rem; }
    .sub { color: var(--muted); margin: 0 0 0.25rem; font-size: 0.95rem; }
    .updated { color: var(--muted); margin: 0 0 1.25rem; font-size: 0.8rem; }
    .progress {
      height: 0.4rem;
      background: var(--line);
      border-radius: 99px;
      overflow: hidden;
      margin-bottom: 0.5rem;
    }
    .bar { height: 100%; width: 0; background: var(--accent); }
    .meta { display: flex; justify-content: space-between; color: var(--muted); font-size: 0.85rem; margin-bottom: 1rem; }
    .card {
      background: var(--card);
      border: 1px solid var(--line);
      border-radius: 12px;
      padding: 1.15rem 1.1rem;
    }
    .q-head { display: flex; align-items: center; gap: 0.5rem; margin-bottom: 0.5rem; }
    .q-icon { font-size: 1.7rem; line-height: 1; }
    .tag {
      display: inline-block;
      font-size: 0.75rem;
      color: var(--accent);
      background: var(--accent-bg);
      padding: 0.15rem 0.5rem;
      border-radius: 99px;
      margin-bottom: 0;
    }
    .q { font-size: 1.2rem; font-weight: 650; margin: 0 0 1rem; line-height: 1.5; }
    form.answer-form { margin: 0; }
    .answer {
      width: 100%;
      padding: 0.75rem 0.85rem;
      border: 1px solid var(--line);
      border-radius: 10px;
      background: #fff;
      color: inherit;
      font: inherit;
      font-size: 1.05rem;
    }
    .answer:focus { outline: 2px solid var(--accent); border-color: var(--accent); }
    .answer.ok { background: var(--ok-bg); border-color: var(--ok); color: var(--ok); }
    .answer.bad { background: var(--bad-bg); border-color: var(--bad); color: var(--bad); }
    .answer:disabled { cursor: default; }
    .answer-form .row { margin-top: 0.75rem; }
    .explain {
      margin-top: 0.75rem;
      padding: 0.75rem 0.85rem;
      background: #fafaf9;
      border-radius: 8px;
      color: var(--ink);
      font-size: 0.95rem;
    }
    .explain .ipa { color: var(--muted); }
    .explain .verdict { margin: 0 0 0.55rem; }
    .explain .ans { margin: 0; }
    .explain .ex-label { margin: 0.7rem 0 0.15rem; }
    .explain .ex { margin: 0; color: var(--ink); }
    .explain .ex-vi { margin: 0.15rem 0 0; color: var(--muted); }
    .explain .mean { margin: 0.4rem 0 0; }
    .row { display: flex; gap: 0.6rem; margin-top: 1rem; flex-wrap: wrap; }
    .btn {
      border: 0;
      border-radius: 10px;
      padding: 0.65rem 1rem;
      font: inherit;
      font-weight: 600;
      cursor: pointer;
      background: var(--accent);
      color: #fff;
    }
    .btn.ghost {
      background: #fff;
      color: var(--ink);
      border: 1px solid var(--line);
    }
    .btn:disabled {
      opacity: 0.4;
      cursor: default;
    }
    .score { font-size: 1.5rem; font-weight: 700; margin: 0.4rem 0; }
    [hidden] { display: none !important; }
  </style>
</head>
<body>
  <main>
    <h1>Pre-IELTS — Vocab quiz</h1>
    <p class="sub">Câu hỏi tiếng Việt. Gõ cụm tiếng Anh, rồi bấm Submit.</p>
    <p class="updated">Cập nhật: 6 Oct 2026, 01:04</p>

    <section id="quiz">
      <div class="progress"><div class="bar" id="bar"></div></div>
      <div class="meta">
        <span id="count"></span>
        <span id="scoreline"></span>
      </div>
      <div class="card">
        <div class="q-head">
          <span class="q-icon" id="qicon" aria-hidden="true"></span>
          <div class="tag" id="tag"></div>
        </div>
        <p class="q" id="question"></p>
        <form class="answer-form" id="form">
          <input class="answer" id="answer" type="text" autocomplete="off" autocapitalize="off" autocorrect="off" spellcheck="false" placeholder="Gõ đáp án tiếng Anh" />
          <div class="row">
            <button class="btn ghost" id="prev" type="button">Câu trước</button>
            <button class="btn" id="submit" type="button">Submit</button>
            <button class="btn" id="next" type="button" hidden>Câu tiếp</button>
          </div>
        </form>
        <div class="explain" id="explain" hidden></div>
      </div>
    </section>

    <section id="done" hidden>
      <div class="card">
        <div class="tag">Xong</div>
        <p class="score" id="final"></p>
        <p class="sub" id="missed"></p>
        <div class="row">
          <button class="btn ghost" id="backLast" type="button">Câu trước</button>
          <button class="btn" id="retry">Làm lại (xáo câu)</button>
        </div>
      </div>
    </section>
  </main>

  <script>
    const BANK = [
      { tag: "Cụm", q: "Nổi tiếng về gì đó", a: "be known for", ipa: "/biː nəʊn fɔː/", meaning: "nổi tiếng vì điều gì", ex: "He is known for his kindness.", exVi: "Anh ấy nổi tiếng vì lòng tốt.", w: ["look down on", "fall behind"] },
      { tag: "Cụm", q: "Kỳ vọng cao ở ai đó", a: "expect a lot from someone", ipa: "/ɪkˈspekt ə lɒt frəm/", meaning: "đòi hỏi / kỳ vọng nhiều ở ai", ex: "Her parents expect a lot from her.", exVi: "Bố mẹ cô ấy kỳ vọng rất nhiều ở cô ấy.", w: ["look down on someone", "take something for granted"] },
      { tag: "Cụm", q: "Đáp ứng / theo kịp kỳ vọng của ai đó", a: "live up to someone's expectations", ipa: "/lɪv ʌp tuː/", meaning: "làm đúng những gì người khác mong", ex: "He worked hard to live up to his parents' expectations.", exVi: "Anh ấy học chăm để không phụ lòng bố mẹ.", w: ["look up to someone", "take something for granted"] },
      { tag: "Cụm", q: "Đặt tiêu chuẩn cao cho ai đó", a: "set high standards for someone", ipa: "/set haɪ ˈstændədz/", meaning: "đòi hỏi ai đó phải làm rất tốt", ex: "That teacher sets high standards for her students.", exVi: "Cô giáo đó đặt tiêu chuẩn cao cho học sinh.", w: ["fall behind", "voice their concerns"] },
      { tag: "Cụm", q: "Theo kịp ai đó", a: "keep up with someone", ipa: "/kiːp ʌp wɪð/", meaning: "không bị tụt lại sau người khác", ex: "I study every day to keep up with my classmates.", exVi: "Tôi học mỗi ngày để theo kịp bạn cùng lớp.", w: ["look up to someone", "look down on someone"] },
      { tag: "Cụm", q: "Bị tụt lại", a: "fall behind", ipa: "/fɔːl bɪˈhaɪnd/", meaning: "chậm hơn người khác", ex: "If you don't practise, you will fall behind in class.", exVi: "Nếu không luyện tập, bạn sẽ bị tụt lại trong lớp.", w: ["aim high", "thrive"] },
      { tag: "Cụm", q: "Ngưỡng mộ", a: "look up to", ipa: "/lʊk ʌp tuː/", meaning: "coi ai đó là hình mẫu", ex: "I look up to my older sister.", exVi: "Tôi ngưỡng mộ chị gái.", w: ["look down on", "take for granted"] },
      { tag: "Cụm", q: "Coi thường", a: "look down on", ipa: "/lʊk daʊn ɒn/", meaning: "khinh / coi ai thấp hơn mình", ex: "Don't look down on people who earn less than you.", exVi: "Đừng coi thường người kiếm ít tiền hơn mình.", w: ["look up to", "keep up with"] },
      { tag: "Cụm", q: "Coi điều gì là hiển nhiên", a: "take something for granted", ipa: "/teɪk fɔː ˈɡrɑːntɪd/", meaning: "không trân trọng vì nghĩ lúc nào cũng có", ex: "Some people take their parents' support for granted.", exVi: "Một số người coi sự hỗ trợ của bố mẹ là hiển nhiên.", w: ["stick to it", "grab people's attention"] },
      { tag: "Cụm", q: "Tấm gương", a: "role model", ipa: "/rəʊl ˈmɒdl/", meaning: "người mình muốn học theo", ex: "My coach is a real role model for me.", exVi: "Huấn luyện viên là tấm gương thật sự với tôi.", w: ["foodie", "algorithms"] },
      { tag: "Cụm", q: "Phát triển mạnh", a: "thrive", ipa: "/θraɪv/", meaning: "lớn lên / làm tốt khi có điều kiện đúng", ex: "Children thrive when they feel supported.", exVi: "Trẻ lớn khỏe khi cảm thấy được hỗ trợ.", w: ["procrastinate", "fall behind"] },
      { tag: "Cụm", q: "Đặt mục tiêu cao", a: "aim high", ipa: "/eɪm haɪ/", meaning: "muốn đạt thứ lớn", ex: "She aims high and works hard every day.", exVi: "Cô ấy đặt mục tiêu cao và làm việc chăm mỗi ngày.", w: ["fall behind", "cut down on screen time"] },
      { tag: "Cụm", q: "Thu hút sự chú ý của người dùng", a: "grab people's attention", ipa: "/ɡræb ˈpiːplz əˈtenʃn/", meaning: "làm người ta phải nhìn / xem", ex: "Short videos are designed to grab people's attention.", exVi: "Video ngắn được làm ra để thu hút sự chú ý.", w: ["set high standards", "stay in shape"] },
      { tag: "Cụm", q: "Cập nhật suốt ngày", a: "updates 24/7", ipa: "/ˌʌpˈdeɪts ˌtwenti fɔː ˈsevn/", meaning: "tin mới cả ngày lẫn đêm", ex: "News apps send updates 24/7, so it is hard to switch off.", exVi: "App tin tức gửi thông báo suốt ngày, nên khó tắt máy.", w: ["a savings account", "screen time"] },
      { tag: "Cụm", q: "Dành quá nhiều thời gian nhìn màn hình", a: "too much screen time", ipa: "/skriːn taɪm/", meaning: "ngồi điện thoại / máy tính quá lâu", ex: "I need to cut down on screen time and follow a schedule.", exVi: "Tôi cần bớt thời gian nhìn màn hình và theo lịch.", w: ["fertility rate", "rush-hour traffic"] },
      { tag: "Cụm", q: "Bày tỏ lo ngại", a: "voice their concerns", ipa: "/vɔɪs ðeə kənˈsɜːnz/", meaning: "nói ra điều mình lo", ex: "A lot of parents voice their concerns about social media.", exVi: "Nhiều bố mẹ bày tỏ lo ngại về mạng xã hội.", w: ["push themselves hard", "try new food"] },
      { tag: "Cụm", q: "Giấc mơ xa vời với nhiều người", a: "a distant dream for many people", ipa: "/ə ˈdɪstənt driːm/", meaning: "muốn lắm nhưng khó với tới", ex: "In big cities, owning an apartment is a distant dream for many people.", exVi: "Ở thành phố lớn, mua căn hộ là giấc mơ xa với nhiều người.", w: ["on average", "at the end of the day"] },
      { tag: "Cụm", q: "Kẹt xe giờ cao điểm", a: "get stuck in rush-hour traffic", ipa: "/ɡet stʌk ɪn rʌʃ aʊə ˈtræfɪk/", meaning: "kẹt đường lúc mọi người đi làm", ex: "I left home early, but I still got stuck in rush-hour traffic.", exVi: "Tôi ra khỏi nhà sớm nhưng vẫn kẹt xe giờ cao điểm.", w: ["become fluent", "live up to expectations"] },
      { tag: "Cụm", q: "Tiện ích (nhà / khu ở)", a: "facilities", ipa: "/fəˈsɪlətiz/", meaning: "gym, hồ bơi, cửa hàng… trong khu", ex: "The apartment has good facilities, like a gym and a shop.", exVi: "Căn hộ có tiện ích tốt, như phòng gym và cửa hàng.", w: ["algorithms", "phenomenon"] },
      { tag: "Cụm", q: "Hòa mình vào một nền văn hóa mới", a: "immerse myself in a new culture", ipa: "/ɪˈmɜːs maɪˈself/", meaning: "sống, ăn, gặp người bản xứ — không chỉ ở khách sạn", ex: "When I travel, I want to immerse myself in a new culture.", exVi: "Khi đi du lịch, tôi muốn hòa mình vào văn hóa mới.", w: ["take it for granted", "fall behind"] },
      { tag: "Cụm", q: "Có thể chi trả", a: "affordable", ipa: "/əˈfɔːdəbl/", meaning: "giá trong tầm với", ex: "We are looking for an affordable flat near the office.", exVi: "Chúng tôi đang tìm căn hộ giá vừa gần chỗ làm.", w: ["unaffordable", "pushy"] },
      { tag: "Cụm", q: "Giữ dáng / khỏe", a: "keep fit / stay in shape", ipa: "/kiːp fɪt/", meaning: "tập để cơ thể khỏe", ex: "She runs three times a week to keep fit.", exVi: "Cô ấy chạy bộ ba lần một tuần để giữ dáng.", w: ["fall behind", "procrastinate"] },
      { tag: "Cụm", q: "Dễ tiếp cận cái gì", a: "have easy access to", ipa: "/hæv ˈiːzi ˈækses tuː/", meaning: "dễ dùng / dễ tới được", ex: "In the city I have easy access to good hospitals.", exVi: "Ở thành phố tôi dễ tới bệnh viện tốt.", w: ["look down on", "take for granted"] },
      { tag: "Writing", q: "Tỷ lệ sinh", a: "fertility rate / birth rate", ipa: "/fəˈtɪləti reɪt/", meaning: "số trẻ được sinh ra", ex: "The fertility rate is falling in many countries.", exVi: "Tỷ lệ sinh đang giảm ở nhiều nước.", w: ["screen time", "rush-hour traffic"] },
      { tag: "Writing", q: "Bất ổn tài chính", a: "financial insecurity", ipa: "/faɪˈnænʃl ˌɪnsɪˈkjʊərəti/", meaning: "không chắc có đủ tiền", ex: "Financial insecurity makes many couples wait to have children.", exVi: "Bất ổn tiền bạc khiến nhiều cặp đôi trì hoãn sinh con.", w: ["soft skills", "a distant dream"] },
      { tag: "Writing", q: "Sự kiện nền tảng (lúc bắt đầu đời người lớn)", a: "cornerstone event", ipa: "/ˈkɔːnəstəʊn ɪˈvent/", meaning: "việc quan trọng làm nền, thường đến sớm", ex: "In the past, getting married was a cornerstone event.", exVi: "Ngày xưa, kết hôn là sự kiện nền tảng lúc mới lớn.", w: ["capstone event", "screen time"] },
      { tag: "Writing", q: "Sự kiện đỉnh (sau khi đã có việc, nhà, tiền)", a: "capstone event", ipa: "/ˈkæpstəʊn ɪˈvent/", meaning: "việc lớn làm sau khi đã đạt mục tiêu khác", ex: "These days marriage is more of a capstone event.", exVi: "Bây giờ kết hôn thường là việc làm sau khi đã ổn định.", w: ["cornerstone event", "role model"] },
      { tag: "Writing", q: "Cha mẹ hay thúc ép", a: "pushy parents", ipa: "/ˈpʊʃi ˈpeərənts/", meaning: "cha mẹ luôn đẩy con phải giỏi hơn", ex: "Pushy parents often set very high standards.", exVi: "Bố mẹ hay thúc ép thường đặt tiêu chuẩn rất cao.", w: ["role model", "foodie"] },
      { tag: "Writing", q: "Cố gắng để xuất sắc", a: "strive for excellence", ipa: "/straɪv fər ˈeksələns/", meaning: "không chỉ qua loa — muốn làm rất tốt", ex: "They want their children to strive for excellence.", exVi: "Họ muốn con cố gắng để xuất sắc.", w: ["take it for granted", "fall behind"] },
      { tag: "Câu", q: "Không còn như vậy nữa", a: "that's not the case anymore", ipa: "/ðæts nɒt ðə keɪs ˌeniˈmɔː/", meaning: "trước khác, giờ khác", ex: "In the past people had many children, but that's not the case anymore.", exVi: "Ngày xưa người ta sinh nhiều con, nhưng giờ không còn vậy.", w: ["they tend to do well", "times are tough"] },
      { tag: "Câu", q: "Khi thời buổi khó khăn", a: "when times are tough", ipa: "/wen taɪmz ə tʌf/", meaning: "lúc cuộc sống vất vả", ex: "When times are tough, some people come out stronger.", exVi: "Khi thời buổi khó khăn, một số người lại mạnh hơn.", w: ["to be more specific", "on average"] },
      { tag: "Câu", q: "Chịu nhiều áp lực từ", a: "under a lot of pressure from", ipa: "/ˈʌndə ə lɒt əv ˈpreʃə/", meaning: "bị ai đó thúc / gây áp lực", ex: "A lot of young people are under a lot of pressure from their parents.", exVi: "Nhiều bạn trẻ chịu nhiều áp lực từ bố mẹ.", w: ["known for", "stuck in"] },
      { tag: "Câu", q: "Cuối cùng thì", a: "at the end of the day", ipa: "/ət ði end əv ðə deɪ/", meaning: "xét cho cùng / điều quan trọng nhất là", ex: "At the end of the day, soft skills are what really matter.", exVi: "Xét cho cùng, kỹ năng mềm mới thật sự quan trọng.", w: ["on that basis", "right away"] },
      { tag: "Speaking", q: "Trì hoãn / để việc đến phút chót", a: "procrastinate", ipa: "/prəʊˈkræstɪneɪt/", meaning: "cứ trì rồi mới làm", ex: "I tend to procrastinate, so I wait until the last minute.", exVi: "Tôi hay trì hoãn, nên cứ để đến phút chót.", w: ["stay focused", "thrive"] },
      { tag: "Speaking", q: "Bám kế hoạch / làm đúng lịch", a: "stick to it", ipa: "/stɪk tuː ɪt/", meaning: "đã đề ra thì làm thật, không bỏ", ex: "I need a daily schedule — and I actually have to stick to it.", exVi: "Tôi cần lịch mỗi ngày — và phải bám đúng lịch đó.", w: ["look down on it", "voice it"] },

      { tag: "Hotel", q: "Đặt phòng", a: "book a room / reserve a room / make a reservation", ipa: "/bʊk ə ruːm/", meaning: "đặt phòng khách sạn", ex: "I'd like to book a room for two nights.", exVi: "Tôi muốn đặt phòng hai đêm." },
      { tag: "Hotel", q: "Đã được đặt trước", a: "reserved", ipa: "/rɪˈzɜːvd/", meaning: "phòng đã có người đặt", ex: "Sorry, that table is reserved.", exVi: "Xin lỗi, bàn đó đã được đặt trước." },
      { tag: "Hotel", q: "Quầy lễ tân / nhân viên lễ tân", a: "front desk / receptionist", ipa: "/frʌnt desk/", meaning: "nơi / người nhận phòng", ex: "Please leave your key at the front desk.", exVi: "Làm ơn để chìa khóa ở quầy lễ tân." },
      { tag: "Hotel", q: "Họ tính bạn bao nhiêu tiền?", a: "charge you for", ipa: "/tʃɑːdʒ juː fɔː/", meaning: "tính phí cho cái gì", ex: "How much did they charge you for the room?", exVi: "Họ tính bạn bao nhiêu tiền phòng?" },
      { tag: "Hotel", q: "Miễn phí", a: "free of charge", ipa: "/friː əv tʃɑːdʒ/", meaning: "không phải trả tiền", ex: "This service is free of charge.", exVi: "Dịch vụ này miễn phí." },
      { tag: "Hotel", q: "Phụ trách / chịu trách nhiệm việc gì", a: "be in charge of / take charge of", ipa: "/bi ɪn tʃɑːdʒ əv/", meaning: "là người chịu trách nhiệm", ex: "I will be in charge of this class next semester.", exVi: "Tôi sẽ phụ trách lớp này học kỳ tới." },

      { tag: "Sept 27", q: "Nghĩ ra ý tưởng mới", a: "come up with original ideas", ipa: "/kʌm ʌp wɪð əˈrɪdʒənl aɪˈdɪəz/", meaning: "nghĩ ra cái mới, không copy", ex: "Young people can come up with original ideas for a company.", exVi: "Người trẻ có thể nghĩ ra ý tưởng mới cho công ty." },
      { tag: "Sept 27", q: "Cởi mở với thay đổi", a: "open to change", ipa: "/ˈəʊpən tə tʃeɪndʒ/", meaning: "không bảo thủ, chịu thử cái mới", ex: "Good leaders are open to change and willing to try new ideas.", exVi: "Lãnh đạo tốt cởi mở với thay đổi và chịu thử ý tưởng mới." },
      { tag: "Sept 27", q: "Suy nghĩ sáng tạo / không theo lối mòn", a: "think outside the box", ipa: "/θɪŋk ˌaʊtˈsaɪd ðə bɒks/", meaning: "nghĩ khác mọi người", ex: "They can think outside the box, aim high, and push themselves.", exVi: "Họ có thể nghĩ khác lối mòn, đặt mục tiêu cao, và tự thúc mình." },
      { tag: "Sept 27", q: "Gánh nặng công việc lớn", a: "a heavy workload", ipa: "/ə ˈhevi ˈwɜːkləʊd/", meaning: "việc nhiều, mệt", ex: "Good health helps them handle a heavy workload.", exVi: "Sức khỏe tốt giúp họ gánh được khối lượng việc lớn." },
      { tag: "Sept 27", q: "Không bảo thủ", a: "not conservative", ipa: "/nɒt kənˈsɜːvətɪv/", meaning: "không khư khư cái cũ", ex: "Young people are often not conservative, so they keep learning.", exVi: "Người trẻ thường không bảo thủ, nên họ cứ học tiếp." },
      { tag: "Sept 27", q: "Thăng tiến / lên nấc thang sự nghiệp", a: "move up the ladder", ipa: "/muːv ʌp ðə ˈlædə/", meaning: "lên chức dần", ex: "That's why they have what it takes to move up the ladder.", exVi: "Đó là lý do họ có đủ tố chất để thăng tiến." },
      { tag: "Sept 27", q: "Muốn chứng tỏ bản thân", a: "prove themselves", ipa: "/pruːv ðəmˈselvz/", meaning: "cho người khác thấy mình làm được", ex: "Many young people want to prove themselves at work.", exVi: "Nhiều bạn trẻ muốn chứng tỏ bản thân lúc đi làm." }
    ];

    const quizEl = document.getElementById("quiz");
    const doneEl = document.getElementById("done");
    const explainEl = document.getElementById("explain");
    const nextBtn = document.getElementById("next");
    const prevBtn = document.getElementById("prev");
    const submitBtn = document.getElementById("submit");
    const inputEl = document.getElementById("answer");
    const formEl = document.getElementById("form");

    let order = [];
    let i = 0;
    let score = 0;
    let missed = 0;
    let scored = false;
    let gotRight = [];
    let leftWrong = [];
    let icons = [];
    const ICONS = ["🌸", "🍀", "⭐", "🌈", "🐱", "🍓", "🌙", "🐻", "🎀", "🍋", "🌼", "🐣", "🍑", "🌊", "🐰", "🍪", "🌟", "🧋"];

    function shuffle(arr) {
      const a = arr.slice();
      for (let n = a.length - 1; n > 0; n--) {
        const j = Math.floor(Math.random() * (n + 1));
        [a[n], a[j]] = [a[j], a[n]];
      }
      return a;
    }

    function norm(s) {
      return String(s)
        .toLowerCase()
        .replace(/[’‘]/g, "'")
        .replace(/[^a-z0-9' ]+/g, " ")
        .replace(/\s+/g, " ")
        .trim();
    }

    function answersOf(item) {
      const raw = [item.a, ...(item.ok || [])];
      return raw.flatMap((s) => String(s).split(/\s*\/\s*/)).map(norm).filter(Boolean);
    }

    function isCorrect(input, item) {
      const got = norm(input);
      if (!got) return false;
      return answersOf(item).some((a) => got === a);
    }

    function start() {
      order = shuffle(BANK);
      i = 0;
      score = 0;
      missed = 0;
      gotRight = [];
      leftWrong = [];
      icons = order.map(() => ICONS[Math.floor(Math.random() * ICONS.length)]);
      quizEl.hidden = false;
      doneEl.hidden = true;
      render();
    }

    function render() {
      scored = !!gotRight[i];
      const item = order[i];
      document.getElementById("qicon").textContent = icons[i];
      document.getElementById("tag").textContent = item.tag;
      document.getElementById("question").textContent = item.q;
      document.getElementById("count").textContent = `Câu ${i + 1}/${order.length}`;
      document.getElementById("scoreline").textContent = `Đúng ${score}`;
      document.getElementById("bar").style.width = `${(i / order.length) * 100}%`;
      explainEl.hidden = true;
      nextBtn.hidden = true;
      submitBtn.hidden = false;
      submitBtn.textContent = "Submit";
      prevBtn.disabled = i === 0;
      inputEl.value = "";
      inputEl.disabled = false;
      inputEl.classList.remove("ok", "bad");
      inputEl.focus();
    }

    function submit() {
      const item = order[i];
      const text = inputEl.value.trim();
      if (!text) {
        inputEl.focus();
        return;
      }
      const ok = isCorrect(text, item);
      inputEl.classList.remove("ok", "bad");
      inputEl.classList.add(ok ? "ok" : "bad");
      if (ok && !gotRight[i]) {
        score += 1;
        gotRight[i] = true;
        scored = true;
        if (leftWrong[i]) {
          missed -= 1;
          leftWrong[i] = false;
        }
      }
      document.getElementById("scoreline").textContent = `Đúng ${score}`;
      explainEl.hidden = false;
      const result = ok ? "Đúng." : "Chưa đúng.";
      const vi = item.exVi ? `<p class="ex-vi">${item.exVi}</p>` : "";
      explainEl.innerHTML =
        `<p class="verdict"><strong>${result}</strong></p>` +
        `<p class="ans"><strong>Answer:</strong> ${item.a} <span class="ipa">${item.ipa}</span></p>` +
        `<p class="ex-label"><strong>Example:</strong></p>` +
        `<p class="ex">${item.ex}</p>` +
        vi;
      nextBtn.hidden = false;
      nextBtn.textContent = i + 1 === order.length ? "Xem điểm" : "Câu tiếp";
    }

    function goNext() {
      if (nextBtn.hidden) return;
      if (!gotRight[i] && !leftWrong[i]) {
        missed += 1;
        leftWrong[i] = true;
      }
      if (i + 1 >= order.length) {
        document.getElementById("bar").style.width = "100%";
        quizEl.hidden = true;
        doneEl.hidden = false;
        document.getElementById("final").textContent = `${score}/${order.length}`;
        document.getElementById("missed").textContent =
          missed === 0 ? "Làm tốt." : `Sai ${missed} câu. Làm lại sẽ nhớ lâu hơn.`;
        return;
      }
      i += 1;
      render();
    }

    formEl.addEventListener("submit", (e) => {
      e.preventDefault();
      submit();
    });

    submitBtn.addEventListener("click", submit);

    nextBtn.addEventListener("click", goNext);

    function goPrev() {
      if (i <= 0) {
        quizEl.hidden = false;
        doneEl.hidden = true;
        render();
        return;
      }
      i -= 1;
      quizEl.hidden = false;
      doneEl.hidden = true;
      render();
    }

    prevBtn.addEventListener("click", goPrev);
    document.getElementById("backLast").addEventListener("click", () => {
      quizEl.hidden = false;
      doneEl.hidden = true;
      render();
    });

    document.getElementById("retry").addEventListener("click", start);
    start();
  </script>
</body>
</html>
